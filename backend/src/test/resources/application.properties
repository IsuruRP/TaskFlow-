spring.datasource.url=jdbc:h2:mem:taskflow;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
taskflow.jwt.secret=test-secret-key-that-is-at-least-thirty-two-characters-long
taskflow.jwt.expiration=3600
taskflow.cors.allowed-origin=http://localhost:5173
logging.level.org.springframework.boot.autoconfigure=INFO
