spring.application.name=TaskFlow Backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TaskFlowDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

taskflow.jwt.secret=${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
taskflow.jwt.expiration=${JWT_EXPIRATION:3600}
taskflow.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
taskflow.bootstrap.admin-email=${ADMIN_EMAIL:}
taskflow.bootstrap.admin-password=${ADMIN_PASSWORD:}
taskflow.bootstrap.admin-name=${ADMIN_NAME:TaskFlow Admin}

spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
